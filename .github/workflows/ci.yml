name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quick:
    name: Quick workflow and API checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test stable APIs and business workflows
        run: >-
          python -m pytest -q
          tests/test_api_compat.py tests/test_infrastructure.py
          tests/test_tabular_workflow.py tests/test_signal_business.py
          tests/test_robotics_api.py tests/test_robot_workcell.py

  matrix:
    name: Full test matrix (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run full test suite
        run: python -m pytest tests/ -q --tb=short

  numpy-fallback:
    name: NumPy fallback regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run full suite on the NumPy backend
        run: python -m pytest tests/ -q
        env:
          MASTERML_BACKEND: numpy

  compiled:
    name: Compiled backend parity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check compiled capabilities
        run: >-
          python -c "from mastermlx.accel import backend_report; report = backend_report(); print(report); assert report['cython'] and report['cpp_distance']"

      - name: Test backend parity
        run: >-
          python -m pytest -q
          tests/test_accel_backend.py tests/test_accel_recurrent_signal.py
          tests/test_graph_cpp.py tests/test_kernels_and_distance.py

  benchmark:
    runs-on: ubuntu-latest
    needs: [quick, matrix]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e ".[dev,compare]"
      - name: Benchmark smoke tests
        run: |
          python benchmarks/bench_models.py
          python benchmarks/bench_tabular.py
          python benchmarks/bench_signal.py
          python benchmarks/bench_workflows.py

  quality:
    runs-on: ubuntu-latest
    needs: quick
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: python -m pip install -e ".[dev]"
      - name: Lint repository
        run: ruff check mastermlx tests
      - name: Type check maintained infrastructure
        run: >-
          mypy
          mastermlx/base/checkpoint.py mastermlx/data/search_core.py
          mastermlx/data/search.py mastermlx/tabular/workflow.py
          mastermlx/base/results.py mastermlx/signal/condition.py
          mastermlx/preprocessing/auto.py mastermlx/preprocessing/column.py
          mastermlx/preprocessing/encoders.py mastermlx/preprocessing/imputers.py
          mastermlx/preprocessing/pipeline.py
          mastermlx/math_tools/ts_experiment.py mastermlx/signal/experiment.py
          mastermlx/neural_net
          --ignore-missing-imports
          --python-version 3.12
      - name: Check public API compatibility
        run: python -m pytest tests/test_api_compat.py -q

  reference:
    name: Reference implementation parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install comparison dependencies
        run: python -m pip install -e ".[dev,compare]"
      - name: Run reference comparisons
        run: python -m pytest tests/test_sklearn_reference.py -q
